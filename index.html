<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Daily Insights Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .shimmer {
            background: #f6f7f8;
            background-image: linear-gradient(to right, #f6f7f8 0%, #edeef1 20%, #f6f7f8 40%, #f6f7f8 100%);
            background-repeat: no-repeat;
            background-size: 800px 100%; 
            animation-duration: 1s;
            animation-fill-mode: forwards; 
            animation-iteration-count: infinite;
            animation-name: placeholderShimmer;
            animation-timing-function: linear;
        }
        @keyframes placeholderShimmer {
            0% { background-position: -468px 0; }
            100% { background-position: 468px 0; }
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-extrabold text-blue-600 flex items-center gap-2">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    AI Daily Insights
                </h1>
                <p class="text-sm text-slate-500 mt-1">인공지능 최신 동향 및 연구 논문 대시보드</p>
            </div>
            <div class="flex items-center gap-2 bg-blue-50 px-4 py-2 rounded-full border border-blue-100">
                <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span id="date-display" class="font-medium text-blue-700 text-sm">로딩 중...</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl mx-auto w-full px-4 py-8 flex flex-col gap-12">
        
        <!-- Search Bar Section -->
        <section class="w-full">
            <div class="flex items-center bg-white rounded-full border border-slate-300 shadow-sm overflow-hidden px-2 py-1 max-w-xl mx-auto focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500 transition-all">
                <svg class="w-5 h-5 text-slate-400 ml-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="search-input" class="w-full px-4 py-3 outline-none text-sm text-slate-700 bg-transparent placeholder-slate-400" placeholder="관심있는 AI 키워드를 검색해보세요 (예: 멀티모달, 로봇)">
                <button id="search-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-full text-sm font-semibold transition-colors whitespace-nowrap ml-2">검색</button>
            </div>
        </section>

        <!-- News Section -->
        <section class="flex flex-col gap-4">
            <div class="flex items-center gap-2 border-b-2 border-slate-800 pb-2">
                <span class="text-2xl">📰</span>
                <h2 class="text-xl font-bold">어제자 핵심 AI 뉴스</h2>
                <span class="ml-auto text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full font-semibold">Gemini Web Search</span>
            </div>
            <!-- 뉴스를 가로 3단 그리드로 배치 -->
            <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Skeleton UI -->
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm h-40">
                    <div class="h-6 w-3/4 shimmer rounded mb-3"></div>
                    <div class="h-4 w-full shimmer rounded mb-2"></div>
                    <div class="h-4 w-5/6 shimmer rounded"></div>
                </div>
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm h-40">
                    <div class="h-6 w-3/4 shimmer rounded mb-3"></div>
                    <div class="h-4 w-full shimmer rounded mb-2"></div>
                    <div class="h-4 w-5/6 shimmer rounded"></div>
                </div>
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm h-40 hidden md:block">
                    <div class="h-6 w-3/4 shimmer rounded mb-3"></div>
                    <div class="h-4 w-full shimmer rounded mb-2"></div>
                    <div class="h-4 w-5/6 shimmer rounded"></div>
                </div>
            </div>
        </section>

        <!-- Trend & Keyword Analysis Section (Report Format) -->
        <section class="flex flex-col gap-4">
            <div class="flex items-center gap-2 border-b-2 border-slate-800 pb-2">
                <span class="text-2xl">📊</span>
                <h2 class="text-xl font-bold">AI 일일 심층 동향 보고서</h2>
                <span class="ml-auto text-xs bg-purple-100 text-purple-700 px-2 py-1 rounded-full font-semibold">Gemini Web Search & Analysis</span>
            </div>
            <div id="trend-container" class="w-full">
                <!-- Skeleton UI -->
                <div class="bg-white p-8 rounded-xl border border-slate-200 shadow-sm">
                    <div class="h-8 w-1/3 shimmer rounded mb-6 mx-auto"></div>
                    <div class="flex gap-2 mb-6 justify-center">
                        <div class="h-6 w-16 shimmer rounded-full"></div>
                        <div class="h-6 w-20 shimmer rounded-full"></div>
                        <div class="h-6 w-14 shimmer rounded-full"></div>
                    </div>
                    <div class="h-4 w-full shimmer rounded mb-2"></div>
                    <div class="h-4 w-full shimmer rounded mb-2"></div>
                    <div class="h-4 w-5/6 shimmer rounded mb-8"></div>
                    <div class="h-6 w-1/4 shimmer rounded mb-4"></div>
                    <div class="h-4 w-full shimmer rounded mb-2"></div>
                    <div class="h-4 w-3/4 shimmer rounded"></div>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 text-slate-400 text-center py-6 mt-8">
        <p class="text-sm">Powered by Gemini API & arXiv API | Designed for AI Insights</p>
    </footer>

    <script>
        // 캔버스 환경에서는 내부 시스템이 자동으로 API 키를 처리하므로 빈 문자열로 두어야 합니다.
        // 개인 API 키를 강제로 할당하면 캔버스의 내부 라우터와 충돌하여 404 에러가 발생합니다.
        const apiKey = ""; 

        // 어제 날짜 계산
        const today = new Date();
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
        const dateStr = yesterday.toLocaleDateString('ko-KR', options);
        document.getElementById('date-display').innerText = `${dateStr} 기준`;

        // 공통 Gemini API 호출 함수 (지수 백오프 적용)
        async function callGemini(prompt, useSearch = false, isJson = false) {
            // 캔버스 전용 지원 모델로 복구 (404 에러 원인 해결)
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }]
            };

            if (useSearch) {
                payload.tools = [{ google_search: {} }];
            }

            let retries = 5;
            let delay = 1000;

            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!response.ok) throw new Error(`API Error: ${response.status}`);
                    
                    const data = await response.json();
                    let text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                    
                    if (isJson) {
                        // 마크다운 코드 블록 제거 및 JSON 파싱
                        text = text.replace(/```json/g, '').replace(/```/g, '').trim();
                        return JSON.parse(text);
                    }
                    return text;

                } catch (e) {
                    if (i === retries - 1) {
                        console.error("Gemini API 호출 최종 실패:", e);
                        return null;
                    }
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2;
                }
            }
        }

        // 스켈레톤 UI HTML 반환 함수 (재로딩 시 활용)
        const getNewsSkeleton = () => `
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm h-40">
                <div class="h-6 w-3/4 shimmer rounded mb-3"></div>
                <div class="h-4 w-full shimmer rounded mb-2"></div>
                <div class="h-4 w-5/6 shimmer rounded"></div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm h-40">
                <div class="h-6 w-3/4 shimmer rounded mb-3"></div>
                <div class="h-4 w-full shimmer rounded mb-2"></div>
                <div class="h-4 w-5/6 shimmer rounded"></div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm h-40 hidden md:block">
                <div class="h-6 w-3/4 shimmer rounded mb-3"></div>
                <div class="h-4 w-full shimmer rounded mb-2"></div>
                <div class="h-4 w-5/6 shimmer rounded"></div>
            </div>
        `;

        const getTrendSkeleton = () => `
            <div class="bg-white p-8 rounded-xl border border-slate-200 shadow-sm">
                <div class="h-8 w-1/3 shimmer rounded mb-6 mx-auto"></div>
                <div class="flex gap-2 mb-6 justify-center">
                    <div class="h-6 w-16 shimmer rounded-full"></div>
                    <div class="h-6 w-20 shimmer rounded-full"></div>
                    <div class="h-6 w-14 shimmer rounded-full"></div>
                </div>
                <div class="h-4 w-full shimmer rounded mb-2"></div>
                <div class="h-4 w-full shimmer rounded mb-2"></div>
                <div class="h-4 w-5/6 shimmer rounded mb-8"></div>
                <div class="h-6 w-1/4 shimmer rounded mb-4"></div>
                <div class="h-4 w-full shimmer rounded mb-2"></div>
                <div class="h-4 w-3/4 shimmer rounded"></div>
            </div>
        `;

        // 1. 뉴스 데이터 가져오기 (Gemini Web Search 활용)
        async function fetchNews(keyword = null) {
            const container = document.getElementById('news-container');
            container.innerHTML = getNewsSkeleton(); // 검색 시 로딩 애니메이션 표시

            let targetTopic = "인공지능(AI), 챗GPT, LLM 등과 관련하여";
            if (keyword) {
                targetTopic = `[${keyword}] 키워드를 중심으로 관련된 최신 인공지능(AI) 기술 및 산업 동향에 대하여`;
            }

            const prompt = `오늘 날짜는 ${new Date().toLocaleDateString('ko-KR')}입니다. 
어제 날짜를 기준으로 ${targetTopic} 주요 언론에서 '가장 많이 보도되고 언급 빈도수가 높은' 핵심 뉴스 정확히 3개를 검색해주세요.
검색 결과를 바탕으로 아래 형식의 엄격한 JSON 배열(Array) 형태로만 응답해주세요. 마크다운이나 다른 텍스트는 절대 포함하지 마세요. 반드시 3개의 아이템이 있어야 합니다.
[
    {
        "title": "뉴스 기사 제목",
        "summary": "해당 뉴스의 핵심 내용 요약 (2~3문장)",
        "link": "https://로 시작하는 실제 뉴스 접속 URL (반드시 유효한 웹 링크여야 함)"
    }
]`;

            try {
                let newsData = await callGemini(prompt, true, true);

                // API 실패 시 Fallback Mock Data (3개로 확장)
                if (!newsData || newsData.length === 0) {
                    newsData = [
                        { title: `[시뮬레이션] ${keyword ? keyword + ' 관련 ' : ''}새로운 AI 모델 전격 공개`, summary: "API 호출이 제한되어 예시 데이터를 표시합니다. 지정한 키워드와 관련된 혁신적인 기술이 발표되어 업계의 이목을 끌고 있습니다.", link: `https://news.google.com/search?q=${keyword ? encodeURIComponent(keyword + ' AI') : '오픈AI+새로운+추론형+AI'}` },
                        { title: `[시뮬레이션] 글로벌 AI 규제 법안 합의안 도출`, summary: "안전한 AI 활용을 위한 글로벌 규제 표준안이 마련되었습니다. 혁신을 저해하지 않는 선에서 딥페이크 및 저작권 문제를 다룰 예정입니다.", link: "https://news.google.com/search?q=글로벌+AI+규제+법안" },
                        { title: `[시뮬레이션] 빅테크 기업들, 온디바이스 AI 경쟁 본격화`, summary: "스마트폰과 PC에서 자체적으로 구동되는 온디바이스 AI를 향한 제조사들의 경쟁이 치열해지고 있습니다.", link: "https://news.google.com/search?q=온디바이스+AI" }
                    ];
                }

                // AI가 3개 미만으로 줬을 경우를 대비해 Mock 데이터로 채움
                while (newsData.length < 3) {
                    newsData.push({
                        title: "[추가 뉴스 검색] 주요 동향 업데이트", 
                        summary: "이 항목은 데이터가 부족하여 자동 생성되었습니다. 더 많은 뉴스를 보려면 관련 키워드로 검색해보세요.", 
                        link: `https://news.google.com/search?q=${keyword ? encodeURIComponent(keyword + ' AI') : '최신+인공지능+뉴스'}`
                    });
                }
                
                // 3개까지만 자르기 (초과 방지)
                newsData = newsData.slice(0, 3);

                container.innerHTML = ''; // 스켈레톤 제거
                
                newsData.forEach(item => {
                    // 링크가 유효하지 않거나 없을 경우 구글 뉴스 검색 링크로 대체하는 안전장치
                    let validLink = item.link;
                    if (!validLink || validLink === "#" || !validLink.startsWith("http")) {
                        validLink = `https://news.google.com/search?q=${encodeURIComponent(item.title)}`;
                    }

                    container.innerHTML += `
                        <a href="${validLink}" target="_blank" rel="noopener noreferrer" class="block bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md hover:border-blue-300 transition-all duration-200 group">
                            <h3 class="font-bold text-lg text-slate-800 group-hover:text-blue-600 mb-2">${item.title}</h3>
                            <p class="text-sm text-slate-600 leading-relaxed">${item.summary}</p>
                            <div class="mt-3 text-xs text-blue-500 font-medium flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                자세히 보기 <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                            </div>
                        </a>
                    `;
                });

            } catch (error) {
                container.innerHTML = `<div class="p-4 bg-red-50 text-red-600 rounded-lg">뉴스를 불러오는 중 오류가 발생했습니다.</div>`;
            }
        }

        // 2. 웹 데이터 기반 트렌드 & 키워드 분석 (Gemini Web Search)
        async function fetchTrendAnalysis(keyword = null) {
            const container = document.getElementById('trend-container');
            container.innerHTML = getTrendSkeleton(); // 검색 시 로딩 애니메이션 표시

            let targetTopic = "인공지능(AI) 관련 기술 트렌드, 새로운 연구 소식, 주요 이슈를";
            if (keyword) {
                targetTopic = `[${keyword}] 키워드와 관련된 인공지능(AI) 기술 트렌드, 새로운 연구 소식, 주요 이슈를 집중적으로`;
            }

            const prompt = `오늘 날짜는 ${new Date().toLocaleDateString('ko-KR')}입니다. 
어제 날짜를 기준으로 웹상에서 가장 많이 언급된 ${targetTopic} 검색하여 심층 보고서 형태로 작성해주세요.
검색 결과를 바탕으로 다음 형식의 엄격한 JSON 객체(Object) 형태로만 응답해주세요. 마크다운이나 다른 텍스트는 절대 포함하지 마세요.
{
    "title": "보고서의 핵심을 담은 제목 (예: 오픈소스 AI의 약진과 저작권 규제 동향)",
    "keywords": ["핵심키워드1", "핵심키워드2", "핵심키워드3", "핵심키워드4", "핵심키워드5"],
    "summary": "어제 화제가 된 AI 동향에 대한 총평 및 요약 (3~4문장 분량)",
    "insights": [
        {
            "topic": "주요 이슈/트렌드 소주제 1",
            "detail": "해당 주제에 대한 상세한 분석 및 시사점 (2~3문장)"
        },
        {
            "topic": "주요 이슈/트렌드 소주제 2",
            "detail": "해당 주제에 대한 상세한 분석 및 시사점 (2~3문장)"
        }
    ]
}`;

            try {
                let trendData = await callGemini(prompt, true, true);

                // API 실패 시 Fallback Mock Data
                if (!trendData) {
                    trendData = {
                        title: `[시뮬레이션] ${keyword ? keyword + ' 관련 ' : ''}기술 진화와 주요 동향 분석`,
                        keywords: [keyword || "새로운 모델", "오픈소스 AI", "멀티모달", "AI 저작권 논쟁", "온디바이스 최적화"],
                        summary: "API 호출이 제한되어 예시 데이터를 표시합니다. 어제 웹상에서는 해당 분야 기술의 성능 향상과 스마트 기기 탑재에 대한 논의가 활발했습니다. 특히 효율성을 극대화한 경량화 모델에 대한 개발자들의 관심이 집중되고 있으며, 관련 규제 논의도 함께 제기되고 있습니다.",
                        insights: [
                            {
                                topic: "최신 기술 동향의 부상",
                                detail: "기존의 한계를 넘어선 새로운 기술과 모델들이 발표되며 클라우드 의존도를 낮추고 프라이버시를 강화하는 방향으로 진화하고 있음을 시사합니다."
                            },
                            {
                                topic: "규제 프레임워크 구체화",
                                detail: "학습 데이터 저작권 침해 논란 등 안전한 활용에 대한 우려가 계속되는 가운데, 주요 국가들을 중심으로 구체적인 가이드라인 마련이 이루어지고 있습니다."
                            }
                        ]
                    };
                }

                container.innerHTML = ''; // 스켈레톤 제거
                
                const keywordsHtml = trendData.keywords.map(kw => 
                    `<span class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-sm font-semibold border border-indigo-100 shadow-sm">#${kw}</span>`
                ).join('');

                const insightsHtml = trendData.insights.map(insight => `
                    <div class="mb-4 last:mb-0">
                        <h4 class="font-bold text-slate-800 text-md flex items-center gap-2 mb-2">
                            <span class="w-1.5 h-1.5 rounded-full bg-blue-500 block"></span>
                            ${insight.topic}
                        </h4>
                        <p class="text-sm text-slate-600 leading-relaxed pl-3 border-l-2 border-slate-100">${insight.detail}</p>
                    </div>
                `).join('');

                container.innerHTML = `
                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                        <!-- 보고서 헤더 -->
                        <div class="bg-slate-50 border-b border-slate-200 p-6 md:p-8 text-center">
                            <h3 class="font-extrabold text-2xl text-slate-800 mb-4">${trendData.title}</h3>
                            <div class="flex flex-wrap gap-2 justify-center">
                                ${keywordsHtml}
                            </div>
                        </div>
                        
                        <!-- 보고서 본문 -->
                        <div class="p-6 md:p-8 flex flex-col gap-8">
                            <!-- 요약 (Executive Summary) -->
                            <div class="bg-blue-50/50 p-5 rounded-lg border border-blue-100">
                                <h4 class="font-bold text-blue-800 text-sm mb-2 uppercase tracking-wide">Executive Summary</h4>
                                <p class="text-slate-700 leading-relaxed text-sm md:text-base">${trendData.summary}</p>
                            </div>
                            
                            <!-- 상세 분석 (Key Insights) -->
                            <div>
                                <h4 class="font-bold text-slate-400 text-sm mb-4 uppercase tracking-wide border-b border-slate-100 pb-2">Key Insights</h4>
                                <div class="flex flex-col gap-2">
                                    ${insightsHtml}
                                </div>
                            </div>
                        </div>
                    </div>
                `;

            } catch (error) {
                container.innerHTML = `<div class="p-4 bg-red-50 text-red-600 rounded-lg">트렌드 데이터를 불러오는 중 오류가 발생했습니다.</div>`;
            }
        }

        // 검색 처리 로직
        function handleSearch() {
            const searchInput = document.getElementById('search-input');
            const keyword = searchInput.value.trim();
            
            // 키워드가 있든 없든 재검색을 수행합니다.
            fetchNews(keyword);
            fetchTrendAnalysis(keyword);
        }

        // 앱 초기화 및 이벤트 리스너 등록
        window.addEventListener('DOMContentLoaded', () => {
            fetchNews();
            fetchTrendAnalysis();

            const searchBtn = document.getElementById('search-btn');
            const searchInput = document.getElementById('search-input');

            // 클릭 및 엔터키 이벤트 등록
            searchBtn.addEventListener('click', handleSearch);
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    handleSearch();
                }
            });
        });

    </script>
</body>
</html>
